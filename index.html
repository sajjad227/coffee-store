<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بن الحصاد — قهوة محمصة طازجة</title>
<meta name="description" content="قهوة محمصة طازجة تصلك خلال يومين. اختر درجة التحميص وأرسل طلبك عبر واتساب.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f1;
    --card:#ffffff;
    --primary:#6b3e26;
    --primary-dark:#4a2a18;
    --accent:#c8925a;
    --text:#2b1d14;
    --muted:#7a6a5d;
    --border:#e8ddd2;
    --green:#25D366;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
  }

  /* ===== Header ===== */
  header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:100;
    box-shadow:0 2px 12px rgba(0,0,0,.04);
  }
  .nav{
    max-width:1200px;margin:0 auto;
    padding:16px 24px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .logo{
    font-size:24px;font-weight:800;color:var(--primary);
    display:flex;align-items:center;gap:10px;
  }
  .logo::before{content:"☕";font-size:28px;}
  .cart-btn{
    background:var(--primary);color:#fff;border:none;
    padding:10px 20px;border-radius:30px;cursor:pointer;
    font-family:inherit;font-weight:700;font-size:15px;
    display:flex;align-items:center;gap:8px;
    transition:.2s;
  }
  .cart-btn:hover{background:var(--primary-dark);}
  .cart-count{
    background:var(--accent);color:#fff;
    border-radius:50%;width:22px;height:22px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;
  }

  /* ===== Hero ===== */
  .hero{
    max-width:1200px;margin:0 auto;
    padding:60px 24px 40px;text-align:center;
  }
  .hero h1{
    font-size:clamp(28px,5vw,48px);
    font-weight:800;color:var(--primary-dark);
    margin-bottom:16px;line-height:1.3;
  }
  .hero p{
    font-size:18px;color:var(--muted);
    max-width:600px;margin:0 auto;
  }

  /* ===== Products ===== */
  .products{
    max-width:1200px;margin:0 auto;
    padding:20px 24px 60px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:24px;
  }
  .product{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    transition:.3s;
    display:flex;flex-direction:column;
  }
  .product:hover{
    transform:translateY(-6px);
    box-shadow:0 16px 32px rgba(107,62,38,.12);
    border-color:var(--accent);
  }
  .product-img-wrap{
    position:relative;
    width:100%;height:220px;
    overflow:hidden;background:#f0e6dc;
  }
  .product-img-wrap img{
    width:100%;height:100%;
    object-fit:cover;
    transition:transform .5s;
    display:block;
  }
  .product:hover .product-img-wrap img{
    transform:scale(1.06);
  }
  .roast-badge{
    position:absolute;top:12px;right:12px;
    background:rgba(107,62,38,.92);color:#fff;
    padding:4px 12px;border-radius:20px;
    font-size:12px;font-weight:700;
    backdrop-filter:blur(4px);
  }
  .product-body{
    padding:18px;display:flex;flex-direction:column;flex:1;
  }
  .product h3{
    font-size:19px;font-weight:800;
    color:var(--primary-dark);margin-bottom:6px;
  }
  .product .desc{
    font-size:14px;color:var(--muted);
    margin-bottom:14px;flex:1;
  }
  .product .footer{
    display:flex;justify-content:space-between;align-items:center;
    gap:10px;
  }
  .price{
    font-size:18px;font-weight:800;color:var(--primary);
  }
  .price small{font-size:12px;font-weight:500;color:var(--muted);}
  .add-btn{
    background:var(--primary);color:#fff;
    border:none;padding:9px 18px;border-radius:24px;
    font-family:inherit;font-weight:700;font-size:14px;
    cursor:pointer;transition:.2s;
  }
  .add-btn:hover{background:var(--primary-dark);}
  .add-btn:active{transform:scale(.96);}

  /* ===== Cart Drawer ===== */
  .cart-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);
    opacity:0;visibility:hidden;transition:.3s;z-index:200;
  }
  .cart-overlay.open{opacity:1;visibility:visible;}
  .cart-drawer{
    position:fixed;top:0;left:0;height:100%;width:min(420px,90vw);
    background:var(--card);
    transform:translateX(-100%);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    z-index:201;display:flex;flex-direction:column;
    box-shadow:-8px 0 32px rgba(0,0,0,.15);
  }
  .cart-drawer.open{transform:translateX(0);}
  .cart-header{
    padding:20px 24px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
  }
  .cart-header h2{font-size:20px;font-weight:800;color:var(--primary-dark);}
  .close-btn{
    background:none;border:none;font-size:28px;
    cursor:pointer;color:var(--muted);line-height:1;
  }
  .cart-items{
    flex:1;overflow-y:auto;padding:16px 24px;
  }
  .cart-empty{
    text-align:center;color:var(--muted);
    padding:60px 20px;font-size:15px;
  }
  .cart-item{
    display:flex;gap:12px;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--border);
  }
  .cart-item img{
    width:56px;height:56px;border-radius:10px;
    object-fit:cover;flex-shrink:0;
  }
  .cart-item-info{flex:1;min-width:0;}
  .cart-item-info h4{
    font-size:15px;font-weight:700;
    color:var(--primary-dark);margin-bottom:2px;
  }
  .cart-item-info span{font-size:13px;color:var(--muted);}
  .qty-controls{
    display:flex;align-items:center;gap:8px;margin-top:6px;
  }
  .qty-controls button{
    width:26px;height:26px;border-radius:50%;
    border:1px solid var(--border);background:#fff;
    cursor:pointer;font-weight:800;color:var(--primary);
    font-family:inherit;
  }
  .qty-controls button:hover{background:var(--bg);}
  .qty-controls span{font-weight:700;min-width:20px;text-align:center;}
  .remove-btn{
    background:none;border:none;color:#c0392b;
    cursor:pointer;font-size:18px;padding:4px;
  }
  .cart-footer{
    padding:20px 24px;border-top:1px solid var(--border);
    background:var(--bg);
  }
  .cart-total{
    display:flex;justify-content:space-between;
    font-size:18px;font-weight:800;
    color:var(--primary-dark);margin-bottom:16px;
  }
  .checkout-btn{
    width:100%;background:var(--green);color:#fff;
    border:none;padding:14px;border-radius:12px;
    font-family:inherit;font-weight:800;font-size:16px;
    cursor:pointer;transition:.2s;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .checkout-btn:hover{background:#1da851;}
  .checkout-btn:disabled{
    background:#ccc;cursor:not-allowed;
  }

  /* ===== Footer ===== */
  footer{
    background:var(--primary-dark);color:#e8ddd2;
    text-align:center;padding:32px 24px;
    font-size:14px;
  }
  footer a{color:var(--accent);text-decoration:none;}

  /* ===== Toast ===== */
  .toast{
    position:fixed;bottom:24px;left:50%;
    transform:translateX(-50%) translateY(100px);
    background:var(--primary-dark);color:#fff;
    padding:12px 24px;border-radius:30px;
    font-weight:700;font-size:14px;
    opacity:0;transition:.3s;z-index:300;
    box-shadow:0 8px 24px rgba(0,0,0,.2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:600px){
    .nav{padding:12px 16px;}
    .logo{font-size:20px;}
    .hero{padding:40px 16px 24px;}
    .hero p{font-size:16px;}
    .products{padding:16px;gap:16px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
    .product-img-wrap{height:170px;}
    .product-body{padding:12px;}
    .product h3{font-size:16px;}
    .product .desc{font-size:13px;}
    .price{font-size:16px;}
    .add-btn{padding:7px 14px;font-size:13px;}
  }
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header>
  <div class="nav">
    <div class="logo">بن الحصاد</div>
    <button class="cart-btn" onclick="openCart()">
      🛒 السلة <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<!-- ===== Hero ===== -->
<section class="hero">
  <h1>قهوة محمصة طازجة، تصلك خلال يومين</h1>
  <p>اختار درجة التحميص التي تناسبك، وأرسل طلبك مباشرة عبر واتساب.</p>
</section>

<!-- ===== Products ===== -->
<main class="products" id="products"></main>

<!-- ===== Cart Drawer ===== -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h2>سلتك</h2>
    <button class="close-btn" onclick="closeCart()">×</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>المجموع</span>
      <span id="cartTotal">0 د.ع</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>
      📱 إتمام الطلب عبر واتساب
    </button>
  </div>
</aside>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<!-- ===== Footer ===== -->
<footer>
  <p>© 2026 بن الحصاد — جميع الحقوق محفوظة</p>
  <p style="margin-top:8px;">تواصل معنا: <a href="https://wa.me/9647700000000">واتساب</a></p>
</footer>

<script>
/* ============================================================
   بيانات المنتجات — عدّل هذا الجزء لإضافة/حذف المنتجات
   ============================================================ */
const PRODUCTS = [
  {
    id: 1,
    name: "إثيوبيا يرجاشيف",
    desc: "زهور وحمضيات، قوام خفيف",
    price: 18000,
    roast: "تحميص فاتح",
    image: "https://images.unsplash.com/photo-1447933601403-0c6688de566e?w=600&q=80&auto=format&fit=crop"
  },
  {
    id: 2,
    name: "كولومبيا هوِيلا",
    desc: "كاراميل وفاكهة حمراء",
    price: 16000,
    roast: "تحميص متوسط",
    image: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=600&q=80&auto=format&fit=crop"
  },
  {
    id: 3,
    name: "البرازيل سانتوس",
    desc: "شوكولاتة ومكسرات",
    price: 14000,
    roast: "تحميص متوسط",
    image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=600&q=80&auto=format&fit=crop"
  },
  {
    id: 4,
    name: "مير اليمن",
    desc: "توابل وثمن قوام ثقيل",
    price: 22000,
    roast: "تحميص غامق",
    image: "https://images.unsplash.com/photo-1524350876685-274059332603?w=600&q=80&auto=format&fit=crop"
  },
  {
    id: 5,
    name: "خلطة السحاب",
    desc: "متوازنة، تناسب الفلتر",
    price: 12000,
    roast: "تحميص فاتح",
    image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600&q=80&auto=format&fit=crop"
  },
  {
    id: 6,
    name: "إسبريسو المساء",
    desc: "كريمة كثيفة ونهاية حلوة",
    price: 15000,
    roast: "تحميص غامق",
    image: "https://images.unsplash.com/photo-1510707577719-ae7c14805e3a?w=600&q=80&auto=format&fit=crop"
  }
];

/* ============================================================
   رقم واتساب — عدّله برقمك (بدون + وبدون مسافات)
   ============================================================ */
const WHATSAPP_NUMBER = "9647700000000";

/* ============================================================
   الحالة (State)
   ============================================================ */
let cart = JSON.parse(localStorage.getItem("cart") || "[]");

/* ============================================================
   رسم المنتجات
   ============================================================ */
function renderProducts(){
  const container = document.getElementById("products");
  container.innerHTML = PRODUCTS.map(p => `
    <div class="product">
      <div class="product-img-wrap">
        <img src="${p.image}" alt="${p.name}" loading="lazy">
        <span class="roast-badge">${p.roast}</span>
      </div>
      <div class="product-body">
        <h3>${p.name}</h3>
        <p class="desc">${p.desc}</p>
        <div class="footer">
          <span class="price">${p.price.toLocaleString("en-US")} <small>د.ع</small></span>
          <button class="add-btn" onclick="addToCart(${p.id})">أضف +</button>
        </div>
      </div>
    </div>
  `).join("");
}

/* ============================================================
   السلة
   ============================================================ */
function addToCart(id){
  const product = PRODUCTS.find(p => p.id === id);
  const existing = cart.find(i => i.id === id);
  if(existing){
    existing.qty++;
  } else {
    cart.push({ ...product, qty: 1 });
  }
  saveCart();
  updateCartUI();
  showToast(`✅ أضفت "${product.name}" إلى السلة`);
}

function removeFromCart(id){
  cart = cart.filter(i => i.id !== id);
  saveCart();
  updateCartUI();
}

function changeQty(id, delta){
  const item = cart.find(i => i.id === id);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){
    removeFromCart(id);
    return;
  }
  saveCart();
  updateCartUI();
}

function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

function updateCartUI(){
  // عدد العناصر
  const totalItems = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById("cartCount").textContent = totalItems;

  // قائمة العناصر
  const itemsEl = document.getElementById("cartItems");
  if(cart.length === 0){
    itemsEl.innerHTML = `<div class="cart-empty">السلة فارغة، أضف منتجاً من القائمة.</div>`;
  } else {
    itemsEl.innerHTML = cart.map(item => `
      <div class="cart-item">
        <img src="${item.image}" alt="${item.name}">
        <div class="cart-item-info">
          <h4>${item.name}</h4>
          <span>${item.price.toLocaleString("en-US")} د.ع</span>
          <div class="qty-controls">
            <button onclick="changeQty(${item.id}, -1)">−</button>
            <span>${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)">+</button>
          </div>
        </div>
        <button class="remove-btn" onclick="removeFromCart(${item.id})" title="حذف">🗑</button>
      </div>
    `).join("");
  }

  // المجموع
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  document.getElementById("cartTotal").textContent = total.toLocaleString("en-US") + " د.ع";

  // زر الطلب
  document.getElementById("checkoutBtn").disabled = cart.length === 0;
}

/* ============================================================
   فتح/إغلاق السلة
   ============================================================ */
function openCart(){
  document.getElementById("cartDrawer").classList.add("open");
  document.getElementById("cartOverlay").classList.add("open");
}
function closeCart(){
  document.getElementById("cartDrawer").classList.remove("open");
  document.getElementById("cartOverlay").classList.remove("open");
}

/* ============================================================
   إتمام الطلب عبر واتساب
   ============================================================ */
function checkout(){
  if(cart.length === 0) return;
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  let msg = "🌿 *طلب جديد من بن الحصاد*\n\n";
  cart.forEach((item, idx) => {
    msg += `${idx + 1}. ${item.name}\n`;
    msg += `   الكمية: ${item.qty} × ${item.price.toLocaleString("en-US")} د.ع\n`;
    msg += `   المجموع: ${(item.qty * item.price).toLocaleString("en-US")} د.ع\n\n`;
  });
  msg += `━━━━━━━━━━━━━━\n`;
  msg += `💰 *المجموع الكلي: ${total.toLocaleString("en-US")} د.ع*\n\n`;
  msg += `📍 من فضلك أرسل:\n- الاسم\n- العنوان\n- رقم الهاتف`;

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
}

/* ============================================================
   Toast
   ============================================================ */
let toastTimer;
function showToast(text){
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ============================================================
   تشغيل
   ============================================================ */
renderProducts();
updateCartUI();
</script>
</body>
</html>
