<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بن الحصاد</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f39c12;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }
        body {
            font-family: 'Cairo', sans-serif, Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        .logo {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .cart-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .hero {
            text-align: center;
            padding: 20px;
        }
        .hero h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }
        .hero p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .cat-btn {
            background-color: #2c2c2c;
            color: var(--text-color);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .cat-btn.active {
            background-color: #fff;
            color: #000;
            font-weight: bold;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px 30px 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-img-container {
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            background-color: #262626;
            border-radius: 8px;
            overflow: hidden;
        }
        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .product-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .product-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            min-height: 30px;
        }
        .product-price {
            font-size: 0.9rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 10px;
        }
        .add-to-cart {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        /* نافذة السلة */
        .cart-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1a1a1a;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            transform: translateY(100%);
            transition: transform 0.3s ease;
            box-sizing: border-box;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 100;
        }
        .cart-modal.open {
            transform: translateY(0);
        }
        .close-cart {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            float: left;
        }
        .cart-items-list {
            margin: 15px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .whatsapp-btn {
            background-color: #25d366;
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">بن الحصاد</div>
        <button class="cart-btn" onclick="toggleCart()">السلة (<span id="cart-count">0</span>)</button>
    </header>

    <section class="hero">
        <h1>قهوة محمصة طازجة، تصلك خلال يومين</h1>
        <p>اختار درجة التحميص التي تناسبك، وأرسل طلبك مباشرة عبر واتساب.</p>
    </section>

    <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('light', this)">فاتح</button>
        <button class="cat-btn" onclick="filterCategory('medium', this)">متوسط</button>
        <button class="cat-btn" onclick="filterCategory('dark', this)">داكن</button>
    </div>

    <div class="products-grid" id="products-grid"></div>

    <!-- نافذة السلة -->
    <div class="cart-modal" id="cartModal">
        <button class="close-cart" onclick="toggleCart()">✕</button>
        <h3>سلتك</h3>
        <div class="cart-items-`list`" id="cartItemsList">
            <p>السلة فارغة، أضف منتجاً من القائمة.</p>
        </div>
        <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px;">
            <span>المجموع</span>
            <span id="total-price">0 د.ع</span>
        </div>
        <input type="text" id="customerName" class="input-field" placeholder="اسمك">
        <input type="text" id="customerAddress" class="input-field" placeholder="عنوان التوصيل">
        <button class="whatsapp-btn" onclick="sendWhatsApp()">إرسال الطلب عبر واتساب</button>
    </div>

    <script>
        // استخدام روابط صور واضحة ومباشرة للمنتجات لضمان ظهورها فوراً
        const products = [
            {
                id: 1,
                name: "إثيوبيا يرجاشيف",
                desc: "زهور وحمضيات، قوام خفيف",
                price: 18000,
                category: "light",
                image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=300&auto=format&fit=crop&q=80" 
            },
            {
                id: 2,
                name: "كولومبيا هوِيلا",
                desc: "كاراميل وفاكهة حمراء",
                price: 16000,
                category: "light",
                image: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=300&auto=format&fit=crop&q=80"
            },
            {
                id: 3,
                name: "البرازيل سانتوس",
                desc: "شوكولاتة ومكسرات",
                price: 14000,
                category: "medium",
                image: "https://images.unsplash.com/photo-1587049352847-4a222e784d38?w=300&auto=format&fit=crop&q=80"
            },
            {
                id: 4,
                name: "مير اليمن",
                desc: "توابل وثمن قوام ثقيل",
                price: 22000,
                category: "dark",
                image: "https://images.unsplash.com/photo-1511920170033-f8396924c348?w=300&auto=format&fit=crop&q=80"
            },
            {
                id: 5,
                name: "خلطة السحاب",
                desc: "متوازنة، تناسب الفلتر",
                price: 12000,
                category: "medium",
                image: "https://images.unsplash.com/photo-1507133750043-4a8f68ae2f87?w=300&auto=format&fit=crop&q=80"
            },
            {
                id: 6,
                name: "إسبريسو المساء",
                desc: "كريمة كثيفة ونهاية حلوة",
                price: 15000,
                category: "dark",
                image: "https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=300&auto=format&fit=crop&q=80"
            }
        ];

        let cart = [];

        function renderProducts(filter = 'all') {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
            
            filtered.forEach(product => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-container">
                            <img src="${product.image}" alt="${product.name}" class="product-img">
                        </div>
                        <div>
                            <div class="product-title">${product.name}</div>
                            <div class="product-desc">${product.desc}</div>
                            <div class="product-price">${product.price.toLocaleString()} د.ع</div>
                        </div>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">أضف للسلة</button>
                    </div>
                `;
            });
        }

        function filterCategory(category, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(category);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            const countElem = document.getElementById('cart-count');
            const listElem = document.getElementById('cartItemsList');
            const totalElem = document.getElementById('total-price');
            
            let totalCount = 0;
            let totalPrice = 0;
            
            if (cart.length === 0) {
                listElem.innerHTML = '<p>السلة فارغة، أضف منتجاً من القائمة.</p>';
            } else {
                listElem.innerHTML = '';
                cart.forEach(item => {
                    totalCount += item.qty;
                    totalPrice += item.price * item.qty;
                    listElem.innerHTML += `
                        <div class="cart-item">
                            <span>${item.name} (${item.qty})</span>
                            <span>${(item.price * item.qty).toLocaleString()} د.ع</span>
                        </div>
                    `;
                });
            }
            countElem.innerText = totalCount;
            totalElem.innerText = totalPrice.toLocaleString() + ' د.ع';
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('open');
        }

        function sendWhatsApp() {
            const name = document.getElementById('customerName').value;
            const address = document.getElementById('customerAddress').value;
            
            if (!name || !address) {
                alert('الرجاء إدخال الاسم وعنوان التوصيل');
                return;
            }
            
            let message = `مرحباً، أريد طلب المنتجات التالية:\n`;
            let total = 0;
            
            cart.forEach(item => {
                message += `- ${item.name} (${item.qty}) : ${item.price * item.qty} د.ع\n`;
                total += item.price * item.qty;
            });
            
            message += `\nالمجموع الكلي: ${total} د.ع\nالاسم: ${name}\nالعنوان: ${address}`;
            
            const phone = "9647800000000"; // استبدل هذا الرقم برقم الواتساب الخاص بك
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
